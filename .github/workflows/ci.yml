# Continuous integration: lint, type-check, test and container-verify every change.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANONYMIZED_TELEMETRY: "False"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install runtime dependencies (hash-locked, same as the Docker image)
        run: "python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock"
      - name: Install dev tools
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check backend/ scripts/
      - name: Ruff format check
        run: python -m ruff format --check backend/ scripts/
      - name: Mypy (strict)
        run: python -m mypy backend/app/ scripts/
      - name: Pytest
        run: python -m pytest backend/tests/ -q --tb=short

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker versions
        run: docker version && docker compose version
      - name: Build and verify containers
        run: python3 scripts/verify_deployment.py
      - name: Upload verifier evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-deployment-evidence
          path: tmp/ragverify-*/
          retention-days: 7
