# Stop demo: switch the AWS server off (it keeps its disk and data; only the compute cost stops).
name: Stop demo

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-switch
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2

jobs:
  stop:
    name: stop the server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: aws-demo
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - name: Switch the server off
        run: |
          set -euo pipefail
          STATE="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                   --query 'Reservations[0].Instances[0].State.Name' --output text)"
          echo "Current state: $STATE"
          if [ "$STATE" = "running" ] || [ "$STATE" = "pending" ]; then
            aws ec2 stop-instances --instance-ids "$INSTANCE_ID" > /dev/null
          fi
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
          echo "Server is stopped."

      - name: Summary
        if: success()
        run: |
          {
            echo "### Demo stopped"
            echo "- The server is off. Only the disk is billed now (about 2 to 3 USD a month)."
            echo "- Run **Start demo** to switch it on again."
          } >> "$GITHUB_STEP_SUMMARY"
