# Start demo: switch the AWS server on, wait until the backend answers, print the links.
# Manual button (Actions tab -> Start demo -> Run workflow). The server stops itself after 3 hours.
name: Start demo

on:
  workflow_dispatch:

# No repository token needed: the job only talks to AWS.
permissions: {}

concurrency:
  group: demo-switch
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  BACKEND_URL: https://ebook-overcook-subsystem.ngrok-free.dev
  SITE_URL: https://personal-rag-assistant-ymwon04.pages.dev

jobs:
  start:
    name: start the server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-demo
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - name: Switch the server on
        run: |
          set -euo pipefail
          STATE="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
                   --query 'Reservations[0].Instances[0].State.Name' --output text)"
          echo "Current state: $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          echo "Server is running."

      - name: Wait until the backend is ready (about 2 to 4 minutes)
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -H "ngrok-skip-browser-warning: 1" "$BACKEND_URL/ready"; then
              echo; echo "Backend is ready."
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become ready in 10 minutes."; exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "### Demo is ready"
            echo "- Website: ${SITE_URL}"
            echo "- Backend: ${BACKEND_URL}"
            echo "- The server stops itself about 3 hours after it started. Use **Stop demo** to stop it sooner."
          } >> "$GITHUB_STEP_SUMMARY"
